name: Update restricted IPs

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restricted-ips
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - run: bun src/restricted-ips.ts
        env:
          INGRESSI_URL: ${{ secrets.INGRESSI_URL }}
          INGRESSI_API_TOKEN: ${{ secrets.INGRESSI_API_TOKEN }}
      - name: Commit changes
        run: |
          git diff --quiet restricted-ips.txt && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update restricted IPs" restricted-ips.txt
          git push
